name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint + typecheck
        run: docker compose --profile test run --rm quality

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Unit tests (packages/core etc.)
        run: docker compose --profile test run --rm unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Integration tests (Postgres + Redis)
        run: docker compose --profile test run --rm integration
      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Playwright e2e (390px + 1280px projects)
        run: docker compose --profile e2e run --rm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose --profile e2e down -v

  # AI evals call the real Claude API (cost!). Manual / label-gated, not on every push.
  evals:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: docker compose --profile test run --rm -e ANTHROPIC_API_KEY integration sh -c "pnpm db:migrate && pnpm db:seed && pnpm evals"
